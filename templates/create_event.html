{% extends "base.html" %}
{% block title %}{{ 'Edit' if event else 'Create' }} Event | CampusConnect{% endblock %}
{% block content %}
<div class="form-page"><div class="section-heading"><div><span class="eyebrow">ORGANIZER STUDIO</span><h1>{{ 'Edit event' if event else 'Create an event' }}</h1><p class="muted">Share the details so students know what to expect.</p></div></div>
<form class="form-card wide" method="post" enctype="multipart/form-data">
<label>Event title<input name="title" required maxlength="180" value="{{ event.title if event else '' }}" placeholder="e.g. Annual Tech Symposium"></label>
<div class="two-col"><label>Club<select name="club_id" required {% if event %}disabled{% endif %}>{% for c in clubs %}<option value="{{ c.id }}" {% if event and event.club_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Category<select name="category" required>{% for c in ['Technology','Cultural','Workshop','Sports','Arts','Career','Other'] %}<option {% if event and event.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label></div>
<label>Description<textarea name="description" rows="6" required placeholder="What is the event about?">{{ event.description if event else '' }}</textarea></label>
<div class="two-col"><label>Date and time<input type="datetime-local" name="event_date" required value="{{ event.event_date.strftime('%Y-%m-%dT%H:%M') if event else '' }}"></label><label>Venue<input name="venue" required value="{{ event.venue if event else '' }}" placeholder="College auditorium"></label></div>
<label>External registration URL (optional)<input type="url" name="registration_url" value="{{ event.registration_url if event else '' }}" placeholder="https://..."></label>
<label>Event poster / image<input type="file" name="poster" accept=".png,.jpg,.jpeg,.webp,.gif"><small class="muted">Maximum 5 MB. PNG, JPG, WEBP or GIF.</small></label>
<button class="button" type="submit">{{ 'Save changes' if event else 'Publish event' }} →</button>
<a class="cancel-link" href="{{ url_for('dashboard') }}">Cancel</a>
</form></div>
{% endblock %}
