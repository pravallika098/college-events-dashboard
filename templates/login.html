{% extends "base.html" %}
{% block title %}Login | CampusConnect{% endblock %}
{% block content %}
<div class="auth-layout"><div class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>There's always something happening on campus.</h1><p>Log in to pick up where you left off.</p></div>
<form class="form-card" method="post"><span class="eyebrow">CAMPUSCONNECT</span><h2>Log in to your account</h2>
<label>Email address<input type="email" name="email" required placeholder="you@college.edu"></label>
<label>Password<input type="password" name="password" required placeholder="Your password"></label>
<button class="button full" type="submit">Log in →</button>
<p class="form-foot">New here? <a href="{{ url_for('signup') }}">Create an account</a></p></form></div>
{% endblock %}
